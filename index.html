<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>My Tasks</h1>

    <div class="add-task">
      <input type="text" id="task-input" placeholder="New task...">
      <button id="add-button">Add Task</button>
    </div>

    <!-- הוספנו כאן פריטים לדוגמה כדי שהרשימה תוצג מיד במסך -->
    <ul id="task-list">
      <li>ללמוד תכנות אתרים</li>
      <li>לעבור על הבאגים</li>
      <li>לסיים את הפרויקט</li>
    </ul>

    <p class="hint">Tip: tick a task when it is done.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
